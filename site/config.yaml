baseURL: "https://literallytheone.github.io"
locale: "en-us"
title: "LiterallyTheOne"

caches:
  images:
    dir: ":cacheDir/images"

menus:
  main:
    - name: "Support me ❤️"
      pageRef: "/support"
      weight: 10
    - name: "About Me"
      pageRef: "/about"
      weight: 20
    - name: "Posts"
      pageRef: "/posts"
      weight: 30
    - name: "Tags"
      pageRef: "/tags"
      weight: 40
    - name: "Tutorials"
      pageRef: "/tutorials"
      weight: 50

pagination:
  pagerSize: 6

outputs:
  home:
    - HTML
    - JSON

ignoreFiles:
  - "README\\.md$"
  - "tutorials/.*/slides/.*$"
